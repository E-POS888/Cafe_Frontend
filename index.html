<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>MUGI Elegance - 雅緻點餐系統</title>
  <meta name="description" content="點滴淬鍊，品味優雅。為您準備莊園級精品咖啡與手作甜點，立即開啟專屬點餐體驗，享受靜謐的咖啡時光。">
  <meta property="og:title" content="MUGI Elegance - 雅緻點餐系統">
  <meta property="og:description" content="點滴淬鍊，品味優雅。為您準備莊園級精品咖啡與手作甜點，立即開啟專屬點餐體驗，享受靜謐的咖啡時光。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=600&q=80">
  <meta property="og:url" content="https://liff.line.me/2012296480-vuLoMBBJ">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    :root { --bg-color: #F9F8F6; --text-main: #2C2C2C; --text-muted: #8C8C8C; --accent-color: #B59B70; --card-bg: #FFFFFF; --border-radius: 12px; --transition: all 0.3s ease; }
    body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 100px; letter-spacing: 0.5px; }
    
    header { background: rgba(249, 248, 246, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 200; border-bottom: 1px solid rgba(0,0,0,0.03); }
    .logo img { height: 28px; object-fit: contain; }
    .user-profile { display: flex; align-items: center; font-size: 13px; font-weight: 500; color: var(--text-main); cursor: pointer; }
    .user-profile img { width: 28px; height: 28px; border-radius: 50%; margin-right: 8px; border: 1px solid rgba(0,0,0,0.05); }

    #admin-entrance { display: none; margin-right: 12px; }
    .admin-link-btn { background: var(--text-main); color: var(--bg-color); border: none; padding: 4px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; margin-right: 4px; font-weight: bold; transition: var(--transition); }
    
    .hero-section { position: relative; width: 100%; max-width: 600px; margin: 0 auto; height: 220px; overflow: hidden; background: #EFEBE4; }
    .carousel { position: relative; width: 100%; height: 100%; }
    .carousel-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.5s ease-in-out; }
    .carousel-img.active { opacity: 1; }
    .hero-overlay { position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%); z-index: 10; pointer-events: none; }
    .announcement-bar { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); width: 90%; background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.3); padding: 6px 12px; border-radius: 20px; color: #FFF; font-size: 13px; display: flex; align-items: center; z-index: 11; box-sizing: border-box; }
    .announce-text { flex: 1; overflow: hidden; white-space: nowrap; }

    .sticky-nav-wrapper { position: sticky; top: 53px; z-index: 150; background: rgba(249, 248, 246, 0.95); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid rgba(0,0,0,0.05); padding: 10px 0; max-width: 600px; margin: 0 auto; }
    .sticky-nav { display: flex; overflow-x: auto; scroll-behavior: smooth; padding: 0 20px; gap: 12px; scrollbar-width: none; }
    .sticky-nav::-webkit-scrollbar { display: none; }
    .nav-tab { background: transparent; color: var(--text-muted); border: 1px solid #E0DCD6; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: var(--transition); }
    .nav-tab.active { background: var(--text-main); color: var(--bg-color); border-color: var(--text-main); }

    .container { padding: 20px 24px; max-width: 600px; margin: 0 auto; }
    .category-section { scroll-margin-top: 120px; }
    .category-title { font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 700; margin: 24px 0 16px 0; color: var(--text-main); display: flex; align-items: center; }
    .category-title::after { content: ''; flex: 1; height: 1px; background: rgba(0,0,0,0.06); margin-left: 16px; }

    .product-grid { display: grid; gap: 16px; }
    .product-card { background: var(--card-bg); border-radius: var(--border-radius); padding: 16px; display: flex; align-items: center; box-shadow: 0 2px 12px rgba(0,0,0,0.03); cursor: pointer; }
    .product-image { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; margin-right: 16px; }
    .product-info { flex: 1; display: flex; flex-direction: column; justify-content: center; pointer-events: none; }
    .product-name { font-family: 'Noto Serif TC', serif; font-size: 16px; font-weight: 700; margin: 0 0 6px 0; color: var(--text-main); }
    .product-price { font-family: 'Noto Sans TC', sans-serif; font-size: 14px; color: var(--accent-color); font-weight: 500; margin-bottom: 10px; }
    .add-btn { align-self: flex-start; background: transparent; color: var(--accent-color); border: 1px solid var(--accent-color); padding: 4px 14px; border-radius: 20px; font-size: 12px; pointer-events: none; }

    .cart-bar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: calc(100% - 48px); max-width: 552px; background: var(--text-main); color: var(--bg-color); padding: 16px 24px; border-radius: 100px; box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 100; }
    .cart-btn { background: var(--accent-color); color: var(--card-bg); border: none; padding: 10px 20px; border-radius: 100px; font-weight: 500; font-size: 14px; cursor: pointer; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; display: flex; align-items: flex-end; justify-content: center; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--bg-color); width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; padding: 30px 24px; box-sizing: border-box; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.1, 1, 0.2, 1); max-height: 85vh; overflow-y: auto; position: relative; }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .close-modal { position: absolute; top: 20px; right: 24px; background: rgba(0,0,0,0.05); border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; color: var(--text-main); display: flex; align-items: center; justify-content: center; }
    
    .cart-item-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,0,0,0.05); padding: 12px 0; }
    .cart-item-info h4 { margin: 0 0 4px 0; font-size: 15px; color: var(--text-main); }
    .cart-item-spec { margin: 0; font-size: 12px; color: var(--text-muted); }
    .cart-item-price { font-weight: bold; color: var(--accent-color); }
    .remove-btn { color: red; background: none; border: none; font-size: 12px; cursor: pointer; margin-top: 4px; padding: 0;}
    
    .member-stats { display: flex; gap: 10px; margin: 20px 0; }
    .stat-card { flex: 1; background: var(--card-bg); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid #E0DCD6; }
    .stat-val { font-size: 18px; font-weight: bold; color: var(--accent-color); margin-bottom: 4px; }
    .stat-lbl { font-size: 12px; color: var(--text-muted); }
    .history-list { margin-top: 20px; }
    .history-item { background: var(--card-bg); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #E0DCD6; font-size: 13px; }

    .modal-header { display: flex; margin-bottom: 20px; }
    .modal-img { width: 100px; height: 100px; border-radius: 12px; object-fit: cover; margin-right: 20px; }
    .modal-title { font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 700; margin: 0 0 8px 0; color: var(--text-main); }
    .modal-price { font-size: 18px; color: var(--accent-color); font-weight: 700; margin: 0; }
    .modal-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid rgba(0,0,0,0.06); }
    .option-group { margin-bottom: 24px; }
    .option-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text-main); }
    .pill-container { display: flex; flex-wrap: wrap; gap: 10px; }
    .pill-radio { display: none; }
    .pill-label { border: 1px solid #E0DCD6; color: var(--text-muted); padding: 8px 16px; border-radius: 100px; font-size: 14px; cursor: pointer; transition: var(--transition); background: var(--card-bg); }
    .pill-radio:checked + .pill-label { background: var(--accent-color); color: var(--card-bg); border-color: var(--accent-color); font-weight: 500; }
    .custom-note-input { width: 100%; padding: 12px 16px; border: 1px solid #E0DCD6; border-radius: 12px; font-family: 'Noto Sans TC', sans-serif; font-size: 14px; box-sizing: border-box; background: var(--card-bg); color: var(--text-main); outline: none; }
    .modal-add-btn { width: 100%; background: var(--text-main); color: var(--bg-color); border: none; padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }

    #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    #loading-screen h2 { font-family: 'Noto Serif TC', serif; color: var(--text-main); font-weight: 500; letter-spacing: 2px; margin-top: 20px; margin-bottom: 5px; }
    #loading-text { color: var(--text-muted); font-size: 13px; letter-spacing: 1px; }
    .coffee-loader { position: relative; width: 70px; height: 80px; }
    .cup-body { position: absolute; bottom: 0; left: 0; width: 50px; height: 40px; border: 3px solid var(--accent-color); border-top: none; border-radius: 0 0 25px 25px; overflow: hidden; z-index: 2; }
    .cup-handle { position: absolute; bottom: 10px; left: 53px; width: 12px; height: 18px; border: 3px solid var(--accent-color); border-left: none; border-radius: 0 15px 15px 0; z-index: 1; }
    .stream { position: absolute; top: 0; left: 25px; width: 3px; background-color: var(--text-main); border-radius: 2px; animation: pourDrop 2.5s infinite ease-in; z-index: 1; }
    .liquid { position: absolute; bottom: 0; left: 0; width: 100%; background-color: var(--text-main); animation: fillUp 2.5s infinite ease-in-out; }
    .steam { position: absolute; width: 4px; height: 15px; background: var(--accent-color); border-radius: 10px; opacity: 0; filter: blur(1px); animation: rise 2.5s infinite ease-in-out; }
    .steam-1 { left: 15px; bottom: 45px; animation-delay: 0.5s; }
    .steam-2 { left: 35px; bottom: 50px; animation-delay: 1.2s; }
    @keyframes pourDrop { 0% { top: -20px; height: 0; opacity: 0; } 15% { top: 0; height: 40px; opacity: 1; } 60% { top: 40px; height: 0; opacity: 0; } 100% { top: 40px; height: 0; opacity: 0; } }
    @keyframes fillUp { 0%, 15% { height: 0%; } 65%, 100% { height: 85%; } }
    @keyframes rise { 0% { transform: translateY(0) scale(1); opacity: 0; } 40% { opacity: 0.6; } 100% { transform: translateY(-25px) scale(1.5); opacity: 0; } }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="coffee-loader"><div class="stream"></div><div class="steam steam-1"></div><div class="steam steam-2"></div><div class="cup-body"><div class="liquid"></div></div><div class="cup-handle"></div></div>
    <h2>MUGI Elegance</h2>
    <p id="loading-text">正在為您準備專屬菜單...</p>
  </div>

  <header>
    <div class="logo"><img id="shop-logo" src="logo.jpg" alt="Logo" onerror="this.src='https://via.placeholder.com/120x40?text=MUGI+Elegance'"></div>
    <div class="user-profile" id="user-profile" onclick="openMemberProfile()">
      <div id="admin-entrance" onclick="event.stopPropagation()">
        <button class="admin-link-btn" onclick="window.location.href='pos.html'">POS</button>
        <button class="admin-link-btn" onclick="window.location.href='admin.html'">後台</button>
      </div>
      <img id="profile-img" src="https://via.placeholder.com/32" alt="User">
      <span id="profile-name">登入中</span>
    </div>
  </header>

  <div class="hero-section">
    <div class="carousel" id="main-carousel">
      <img src="https://images.unsplash.com/photo-1497935586351-b67a49e012bf?auto=format&fit=crop&w=600&q=80" class="carousel-img active" alt="Coffee 1">
      <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=600&q=80" class="carousel-img" alt="Coffee 2">
      <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=600&q=80" class="carousel-img" alt="Coffee 3">
    </div>
    <div class="hero-overlay"></div>
    <div class="announcement-bar"><span class="announce-icon">✨</span><marquee class="announce-text" scrollamount="3">歡迎來到 MUGI DAYS 麥好日！響應環保，自備環保杯點購飲品即可享 5 元折抵優惠。</marquee></div>
  </div>

  <div class="sticky-nav-wrapper"><div class="sticky-nav" id="sticky-nav"></div></div>
  <div class="container" id="menu-container"></div>
  <div class="cart-bar"><div id="cart-summary">Cart • 0 | $0</div><button class="cart-btn" onclick="openCheckoutModal()">結帳</button></div>

  <!-- 註冊彈窗 -->
  <div class="modal-overlay" id="register-modal">
    <div class="modal-content">
      <h3 class="modal-title">完善會員資料</h3>
      <div class="option-group"><div class="option-title">姓名</div><input type="text" id="reg-name" class="custom-note-input"></div>
      <div class="option-group"><div class="option-title">手機號碼 (必填)</div><input type="tel" id="reg-phone" class="custom-note-input" required></div>
      <div class="option-group"><div class="option-title">大樓樓層 (選填)</div><input type="text" id="reg-floor" class="custom-note-input" placeholder="例如：寰宇大樓 5F"></div>
      <div class="option-group"><div class="option-title">其他備註 (選填)</div><input type="text" id="reg-note" class="custom-note-input" placeholder="例如：個人喜好或特殊需求"></div>
      <button class="modal-add-btn" onclick="submitRegistration()">完成註冊</button>
    </div>
  </div>

  <!-- 商品客製化彈窗 -->
  <div class="modal-overlay" id="product-modal" onclick="closeModal('product-modal', event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-modal" onclick="closeModal('product-modal', true)">✕</button>
      <div class="modal-header">
        <img class="modal-img" id="modal-img" src="" alt="Product">
        <div><h3 class="modal-title" id="modal-title">商品</h3><p class="modal-price" id="modal-price">$0</p></div>
      </div>
      <div class="modal-desc" id="modal-desc"></div>
      <div id="modal-options-container"></div>
      <div class="option-group"><div class="option-title">專屬杯備註 (選填)</div><input type="text" id="modal-note" class="custom-note-input"></div>
      <button class="modal-add-btn" onclick="confirmAddToCart()">確認加入購物車</button>
    </div>
  </div>

  <!-- 結帳確認彈窗 (加入整筆訂單 內用/外帶 設定) -->
  <div class="modal-overlay" id="checkout-modal" onclick="closeModal('checkout-modal', event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-modal" onclick="closeModal('checkout-modal', true)">✕</button>
      <h3 class="modal-title" style="margin-bottom: 20px;">訂單確認</h3>
      <div id="checkout-list" style="margin-bottom: 20px; max-height: 40vh; overflow-y: auto;"></div>
      <div style="text-align: right; font-size: 20px; font-weight: bold; color: var(--accent-color); margin-bottom: 20px;" id="checkout-total-display">總計: $0</div>
      
      <div class="option-group">
        <div class="option-title">用餐方式</div>
        <div class="pill-container">
          <input type="radio" name="dineInType" id="dine-in" class="pill-radio" value="內用" checked>
          <label for="dine-in" class="pill-label">🍽️ 內用</label>
          <input type="radio" name="dineInType" id="takeaway" class="pill-radio" value="外帶">
          <label for="takeaway" class="pill-label">🛍️ 外帶</label>
        </div>
      </div>

      <div class="option-group">
        <div class="option-title">選擇付款方式</div>
        <div class="pill-container">
          <input type="radio" name="payMethod" id="pay-cash" class="pill-radio" value="現金" checked>
          <label for="pay-cash" class="pill-label">櫃檯現金</label>
          <input type="radio" name="payMethod" id="pay-line" class="pill-radio" value="LINE Pay">
          <label for="pay-line" class="pill-label">LINE Pay</label>
        </div>
      </div>
      <button class="modal-add-btn" onclick="submitOrder()">送出訂單</button>
    </div>
  </div>

  <!-- 會員專區與歷史訂單彈窗 -->
  <div class="modal-overlay" id="member-modal" onclick="closeModal('member-modal', event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-modal" onclick="closeModal('member-modal', true)">✕</button>
      <h3 class="modal-title" id="member-name-title">會員專區</h3>
      <div class="member-stats">
        <div class="stat-card">
          <div class="stat-val" id="habit-drink">-</div>
          <div class="stat-lbl">最愛飲品</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="habit-count">0</div>
          <div class="stat-lbl">累計訂單</div>
        </div>
      </div>
      <h4 style="margin: 0; font-size: 15px; color: var(--text-main);">近期訂單</h4>
      <div class="history-list" id="order-history-list">
        <p style="font-size: 13px; color: var(--text-muted);">載入中...</p>
      </div>
    </div>
  </div>

  <script src="Js/config.js"></script>
  <script src="Js/app.js"></script>
</body>
</html>
