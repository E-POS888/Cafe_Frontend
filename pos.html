<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Connect - POS 專業收銀</title>
  <style>
    :root { --primary-color: #8D6E63; --secondary-color: #D7CCC8; --bg-color: #F5F5DC; --text-main: #3E2723; --white: #FFFFFF; --border-radius: 8px; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; position: relative; }
    
    .left-panel { width: 30%; background: var(--secondary-color); padding: 15px; display: flex; flex-direction: column; border-right: 1px solid rgba(0,0,0,0.1); box-sizing: border-box; gap: 10px; }
    .status-section { flex: 1; display: flex; flex-direction: column; background: rgba(255,255,255,0.4); border-radius: var(--border-radius); padding: 10px; overflow: hidden; }
    .status-section h4 { margin: 0 0 10px 0; font-size: 16px; color: var(--text-main); padding-bottom: 5px; border-bottom: 2px solid var(--primary-color); }
    .order-list-container { flex: 1; overflow-y: auto; padding-right: 5px; }
    
    .order-card { background: var(--white); padding: 12px; border-radius: var(--border-radius); margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 4px solid var(--primary-color); }
    .action-btn { background: var(--primary-color); color: var(--white); border: none; padding: 6px 12px; border-radius: var(--border-radius); cursor: pointer; width: 100%; margin-top: 8px; font-weight:bold; font-size: 13px; }
    
    .menu-panel { width: 45%; padding: 15px; display: flex; flex-direction: column; box-sizing: border-box; }
    .category-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .tab-btn { padding: 8px 12px; background: var(--white); border: 1px solid var(--primary-color); color: var(--primary-color); border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight:bold; font-size: 13px; }
    .tab-btn.active { background: var(--primary-color); color: var(--white); }
    .pos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; overflow-y: auto; align-content: flex-start; }
    .pos-item { background: var(--white); padding: 12px 8px; border-radius: var(--border-radius); text-align: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .pos-item:hover { border: 2px solid var(--primary-color); }
    
    .checkout-panel { width: 25%; background: var(--white); padding: 20px; display: flex; flex-direction: column; border-left: 1px solid rgba(0,0,0,0.1); box-sizing: border-box; position: relative;}
    .cart-list { flex: 1; overflow-y: auto; margin-bottom: 20px; background: #f9f9f9; border-radius: var(--border-radius); padding: 10px; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px dashed #ccc; padding-bottom: 10px; font-size:15px;}
    .total-display { font-size: 28px; font-weight: bold; text-align: right; margin-bottom: 15px; color: #d32f2f; }
    
    .pay-btn-group { display: flex; flex-direction: column; gap: 10px; }
    .checkout-btn { width: 100%; padding: 15px; background: #4CAF50; color: white; border: none; border-radius: var(--border-radius); font-size: 18px; font-weight: bold; cursor: pointer; }
    .clear-btn { width: 100%; padding: 15px; background: #9e9e9e; color: white; border: none; border-radius: var(--border-radius); font-size: 16px; font-weight: bold; cursor: pointer; }
    
    .current-order-badge { background: #e65100; color: white; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; text-align: center; margin-bottom: 15px; display: none; }
    .member-phone-input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }

    /* 歷史訂單展開按鈕與面板 */
    .history-toggle-btn { position: absolute; bottom: 20px; right: 20px; background: var(--primary-color); color: white; border: none; border-radius: 50px; padding: 10px 20px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 100; }
    .history-panel { position: absolute; top: 0; right: -100%; width: 100%; height: 100%; background: white; z-index: 90; transition: right 0.3s ease; box-shadow: -5px 0 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
    .history-panel.open { right: 0; }
    .history-list { flex: 1; overflow-y: auto; margin-top: 15px; }
    .history-card { border: 1px solid #eee; padding: 12px; border-radius: 8px; margin-bottom: 10px; background: #fafafa; }

    /* 彈窗樣式 (Modal) */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; display: flex; align-items: center; justify-content: center; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .full-modal-content { background: var(--white); width: 90%; max-width: 1000px; height: 90vh; border-radius: 16px; padding: 30px; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    .full-modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--primary-color); padding-bottom: 15px; margin-bottom: 20px; }
    .full-modal-body { flex: 1; display: flex; gap: 30px; overflow: hidden; }
    .full-order-details { flex: 6; overflow-y: auto; font-size: 20px; line-height: 1.6; background: #f9f9f9; padding: 20px; border-radius: 12px; }
    .full-payment-area { flex: 4; display: flex; flex-direction: column; justify-content: space-between; }
    
    .pay-option-btn { width: 100%; padding: 20px; margin-bottom: 15px; border: none; border-radius: 12px; font-size: 22px; font-weight: bold; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .bg-cash { background: #4CAF50; }
    .bg-line { background: #00C300; }
    .bg-jko { background: #E53935; }
    .bg-bank { background: #1976D2; }
    
    .small-modal-content { background: var(--bg-color); width: 400px; border-radius: 16px; padding: 30px; text-align: center; }
    #error-msg { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(255,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; z-index: 3000; display: none; }
  </style>
</head>
<body>

  <div id="error-msg"></div>

  <div class="left-panel">
    <div class="status-section">
      <h4>🆕 待接單 (線上進單)</h4>
      <div id="pending-container" class="order-list-container"></div>
    </div>
    <div class="status-section">
      <h4>🧑‍🍳 製作與出餐區</h4>
      <div id="making-container" class="order-list-container"></div>
    </div>
    <div class="status-section" style="flex: 0.8; background: rgba(0,0,0,0.05);">
      <h4>✅ 今日完成</h4>
      <div id="completed-container" class="order-list-container"></div>
    </div>
  </div>

  <div class="menu-panel">
    <div class="category-tabs" id="category-tabs"></div>
    <div class="pos-grid" id="pos-grid"></div>
  </div>

  <div class="checkout-panel">
    <h2 style="margin:0 0 15px 0; font-size:20px;">結帳收銀</h2>
    
    <div id="current-order-badge" class="current-order-badge">處理中：ORD-XXXXX</div>
    
    <div class="category-tabs" style="margin-bottom: 10px;">
      <input type="radio" name="posDineInType" id="pos-takeaway" value="外帶" style="display:none;" checked>
      <label for="pos-takeaway" class="tab-btn active" onclick="document.getElementById('pos-takeaway').checked=true; document.querySelectorAll('label[for^=pos-]').forEach(l=>l.classList.remove('active')); this.classList.add('active');" style="flex:1; text-align:center; font-size:14px; padding:10px;">🛍️ 外帶</label>
      
      <input type="radio" name="posDineInType" id="pos-dinein" value="內用" style="display:none;">
      <label for="pos-dinein" class="tab-btn" onclick="document.getElementById('pos-dinein').checked=true; document.querySelectorAll('label[for^=pos-]').forEach(l=>l.classList.remove('active')); this.classList.add('active');" style="flex:1; text-align:center; font-size:14px; padding:10px;">🍽️ 內用</label>
    </div>

    <input type="tel" id="pos-member-phone" class="member-phone-input" placeholder="🔍 現場單綁定：輸入會員手機號碼 (選填)">

    <div class="cart-list" id="pos-cart-list"></div>
    <div class="total-display" id="pos-total">Total: $0</div>
    
    <div class="pay-btn-group">
      <button class="checkout-btn" onclick="openFullCheckoutModal()">確認明細與結帳 ➜</button>
      <button class="clear-btn" onclick="clearCart()">清空 / 換單</button>
    </div>

    <!-- 歷史訂單展開按鈕與面板 -->
    <button class="history-toggle-btn" onclick="toggleHistoryPanel()">📋 歷史訂單</button>
    <div class="history-panel" id="history-panel">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--primary-color); padding-bottom:10px;">
        <h3 style="margin:0;">當日已完成訂單</h3>
        <button style="background:none; border:none; font-size:24px; cursor:pointer;" onclick="toggleHistoryPanel()">✕</button>
      </div>
      <div class="history-list" id="history-list-container"></div>
    </div>
  </div>

  <div class="modal-overlay" id="full-checkout-modal">
    <div class="full-modal-content">
      <div class="full-modal-header">
        <h2 style="margin:0; font-size:28px;">🧾 訂單明細核對</h2>
        <button style="background:none; border:none; font-size:30px; cursor:pointer;" onclick="closeModal('full-checkout-modal')">✕</button>
      </div>
      <div class="full-modal-body">
        <div class="full-order-details">
          <div style="font-weight:bold; color:var(--primary-color); margin-bottom:15px; font-size:24px;" id="full-modal-type">🛍️ 外帶 - 現場客</div>
          <div id="full-modal-items"></div>
          <div style="border-top:2px solid #ccc; margin-top:20px; padding-top:20px; text-align:right; font-size:40px; font-weight:bold; color:#d32f2f;" id="full-modal-total">總計: $0</div>
        </div>
        <div class="full-payment-area">
          <h3 style="margin-top:0;">請選擇收款方式</h3>
          <div>
            <button class="pay-option-btn bg-cash" onclick="selectPaymentMethod('現金')">💵 現金結帳</button>
            <button class="pay-option-btn bg-line" onclick="selectPaymentMethod('LINE Pay')">📱 LINE Pay</button>
            <button class="pay-option-btn bg-jko" onclick="selectPaymentMethod('街口支付')">📱 街口支付</button>
            <button class="pay-option-btn bg-bank" onclick="selectPaymentMethod('匯款/轉帳')">🏦 匯款 / 轉帳</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="cash-modal">
    <div class="small-modal-content">
      <h2 style="margin-top: 0;">現金收銀</h2>
      <div style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">應收：<span id="cash-modal-total" style="color: #d32f2f;">$0</span></div>
      <div style="text-align: left; margin-bottom: 20px;">
        <label style="font-weight: bold; display: block; margin-bottom: 8px;">客付金額 (實收)：</label>
        <input type="number" id="cash-received" style="width: 100%; padding: 15px; font-size: 24px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; text-align: right;" placeholder="輸入金額" oninput="calculateChange()">
      </div>
      <div style="font-size: 24px; font-weight: bold; margin-bottom: 30px;">找零：<span id="cash-modal-change" style="color: #388e3c;">$0</span></div>
      <div style="display: flex; gap: 15px;">
        <button style="flex: 1; padding:15px; background:#9e9e9e; color:white; border:none; border-radius:8px; font-size:18px;" onclick="closeModal('cash-modal')">取消</button>
        <button style="flex: 1; padding:15px; background:#388e3c; color:white; border:none; border-radius:8px; font-size:18px; font-weight:bold;" onclick="confirmCashCheckout()">確認完成</button>
      </div>
    </div>
  </div>

  <script src="Js/config.js"></script>
  <script src="Js/pos.js"></script>
</body>
</html>
